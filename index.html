<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ME2種演習" />
<title>ME2種 過去問演習 Cloudflare/GitHub版</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#eef2ff;--good:#16a34a;--bad:#dc2626;--warn:#f59e0b;--shadow:0 8px 24px rgba(0,0,0,.045)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:max(18px,env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.header-inner{max-width:1080px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:18px;margin:0;line-height:1.35}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge,.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;color:var(--muted)}main{max-width:1080px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 76px max(14px,env(safe-area-inset-left))}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.card h2{margin:0 0 10px;font-size:21px}.card h3{margin:0 0 8px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.round-card,.part-card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.025)}.round-card{cursor:pointer}.round-card:hover{border-color:#93c5fd;background:#eff6ff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:16px;padding:13px 16px;min-height:52px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;font-size:16px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button.secondary{background:var(--accent2);color:#1d4ed8}button.ghost{background:#f3f4f6;color:#374151}button.danger{background:#fee2e2;color:#991b1b}button.warn{background:#fef3c7;color:#92400e}button:disabled{opacity:.7;cursor:not-allowed}.small{font-size:13px;color:var(--muted);line-height:1.65}.mobile-note,.filebox{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;padding:12px;margin:12px 0}.choice{width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:10px 0;display:flex;align-items:flex-start;gap:12px;font-weight:750;line-height:1.55}.choice:hover{border-color:#93c5fd;background:#eff6ff}.choice.correct{border-color:#86efac;background:#f0fdf4;color:#166534}.choice.wrong{border-color:#fecaca;background:#fef2f2;color:#991b1b}.choice .num{min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#f3f4f6;color:#111827;font-size:18px}.choice.correct .num{background:#dcfce7;color:#166534}.choice.wrong .num{background:#fee2e2;color:#991b1b}.progressbar{width:100%;height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px}.progressbar>div{height:100%;width:0;background:var(--accent);transition:.25s}.question-title{font-size:14px;color:var(--muted);margin-bottom:8px;line-height:1.55}.stem{font-size:20px;line-height:1.75;white-space:pre-wrap;margin:10px 0 18px;word-break:break-word}.result{border-radius:16px;padding:14px;margin-top:14px;border:1px solid var(--line);background:#fafafa;display:none}.result.good{border-color:#86efac;background:#f0fdf4}.result.bad{border-color:#fecaca;background:#fef2f2}.explain-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}.explain-table th,.explain-table td{border-top:1px solid var(--line);padding:9px 6px;vertical-align:top;text-align:left}.source-img{width:100%;max-height:900px;object-fit:contain;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:10px}.image-hint{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 0}details{margin-top:12px}summary{cursor:pointer;color:#1d4ed8;font-weight:800;padding:8px 0}.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}.kpi div{background:#f9fafb;border:1px solid var(--line);border-radius:16px;padding:12px}.kpi b{display:block;font-size:20px;margin-top:2px}.wrong-item,.history-row{border-top:1px solid var(--line);padding:12px 0}.hidden{display:none!important}.menu-crumb{margin-bottom:10px}.menu-crumb button{min-height:40px;padding:8px 12px;font-size:14px}.save-state{font-size:13px;color:#166534;font-weight:700}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3f4f6;padding:2px 6px;border-radius:8px}.loginbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.loginbox a{color:#1d4ed8;text-decoration:none;font-weight:800}.status-ok{color:#166534}.status-warn{color:#92400e}@media(max-width:760px){.header-inner{align-items:flex-start;gap:8px}h1{font-size:16px;width:100%}.top-actions,.row{width:100%}.badge{font-size:12px;padding:6px 8px}main{padding-top:12px}.card{border-radius:18px;padding:14px}.grid{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.stem{font-size:17px;line-height:1.8}button{width:100%;font-size:16px;min-height:54px}.choice{padding:13px 12px}.explain-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:normal}.source-img{max-height:none}.top-actions button{width:auto;min-height:38px;padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<header><div class="header-inner"><h1>ME2種 過去問ボタン式演習</h1><div class="top-actions"><span class="badge" id="userBadge">ログイン確認中</span><span class="badge" id="sourceBadge">GitHub確認中</span><span class="badge" id="partBadge">未開始</span><span class="badge" id="timerBadge">00:00</span><span class="badge" id="scoreBadge">0/0 正解</span><span class="save-state" id="saveStateText"></span></div></div></header>
<main>
<section id="menuCard" class="card"><h2>試験回を選択</h2><p class="small">問題JSONと図表画像は <span class="code">Date/Ques</span> / <span class="code">Date/img</span> から取得します。GitHub設定が未完了でも、同梱ファイルから自動で読み込むようにしました。</p><div class="mobile-note small"><b>読み込み状態：</b><span id="loadMode">確認中</span><br><b>進行保存：</b><span id="progressMode">端末保存 + Cloudflare保存確認中</span></div><div class="row" style="margin-bottom:12px"><button class="ghost" onclick="showLoginInfo()">ログイン情報</button><button class="ghost" onclick="exportAllProgress()">全履歴をJSON保存</button><label class="ghost" style="padding:14px 16px;border-radius:16px;display:inline-block;cursor:pointer">進行JSONを読み込み<input type="file" accept="application/json,.json" onchange="importProgress(this)" style="display:none"></label><span class="pill" id="roundCount"></span></div><div class="grid" id="examGrid"></div></section>
<section id="loginCard" class="card hidden"><div class="menu-crumb"><button class="ghost" onclick="showMenu()">← メニューへ</button></div><h2>ログイン情報</h2><div id="loginInfo" class="small"></div><div class="row" style="margin-top:12px"><a class="pill" href="/cdn-cgi/access/logout">Cloudflare Accessからログアウト</a><button class="secondary" onclick="loadMe()">再確認</button></div></section>
<section id="partCard" class="card hidden"><div class="menu-crumb"><button class="ghost" onclick="showMenu()">← 回数選択へ</button></div><h2 id="selectedExamTitle"></h2><p class="small">午前・午後を選んでください。途中保存がある場合は「途中から」で再開できます。</p><div class="grid"><div class="part-card" id="amBox"></div><div class="part-card" id="pmBox"></div></div><div class="row" style="margin-top:12px"><button class="danger" onclick="resetPart('am')">午前の途中保存を削除</button><button class="danger" onclick="resetPart('pm')">午後の途中保存を削除</button></div></section>
<section id="quizCard" class="card hidden"><div class="menu-crumb"><button class="ghost" onclick="selectExam(state.examId)">← 午前/午後選択へ</button></div><div class="question-title" id="qMeta"></div><div class="progressbar"><div id="bar"></div></div><div class="stem" id="stem"></div><div id="questionImage"></div><div id="choices"></div><div id="result" class="result"></div><div class="row" style="margin-top:14px"><button id="nextBtn" class="secondary hidden" onclick="nextQuestion()">次の問題へ</button><button class="ghost" onclick="exportCurrentJSON()">現在の進行をJSON保存</button><button class="ghost" onclick="showMenu()">メニューへ</button></div></section>
<section id="finishCard" class="card hidden"><div class="menu-crumb"><button class="ghost" onclick="selectExam(state.examId)">← 午前/午後選択へ</button></div><h2>終了！</h2><div class="kpi"><div>部門<b id="finalPart">-</b></div><div>正解数<b id="finalScore">-</b></div><div>正答率<b id="finalRate">-</b></div><div>所要時間<b id="finalTime">-</b></div></div><div class="row" style="margin-top:14px"><button onclick="startAttempt(state.part,'all')">もう一度全問</button><button class="warn" id="retryWrongBtn" onclick="retryWrong()">間違いだけ復習</button><button class="ghost" onclick="exportCurrentCSV()">結果CSV保存</button><button class="ghost" onclick="exportCurrentJSON()">今回の進行JSON保存</button></div><div id="wrongList"></div></section>
</main>
<script>
const APP_CONFIG = {
  // auto: /api/github → 同梱ファイル → GitHub Raw の順に自動で試します。
  // Cloudflare側のGitHub環境変数が未設定でも、Date/Ques の同梱JSONから読み込めます。
  sourceMode: 'auto',
  github: { owner: '', repo: '', branch: 'main', rootPath: '' },
  cloudProgress: true
};
const $=id=>document.getElementById(id);
let me={authenticated:false,email:null,name:null};
let examsIndex={exams:[]};
let currentExamId=null, partsCache={}, tickHandle=null;
let state={examId:null,part:null,mode:'all',order:[],index:0,correct:0,answers:[],startedAt:null,finished:false};
function escapeHtml(str){return String(str??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function fmtTime(ms){if(!ms||ms<0)return'00:00';const s=Math.floor(ms/1000),m=Math.floor(s/60),sec=s%60,h=Math.floor(m/60),mm=m%60;return h>0?`${h}:${String(mm).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function partName(p){return p==='am'?'午前':'午後'}
function correctLabel(q){return q.correct.length>1?q.correct.join(' または '):String(q.correct[0])}
let activeSourceMode = 'local';
const GUEST_KEY = 'me2_guest_login';
function safeAssetPath(path){return String(path||'').replace(/^\.\//,'').replace(/^\//,'')}
function githubConfigured(){const g=APP_CONFIG.github||{};return Boolean(g.owner&&g.repo&&g.owner!=='YOUR_GITHUB_USER'&&g.repo!=='ME2_JSON_App')}
function sourceLabel(mode){return {auto:'自動',cloudflare_proxy:'Cloudflare Proxy',github_raw:'GitHub Raw',local:'同梱ファイル'}[mode]||mode}
function assetUrlForMode(path, mode){
  const safe=safeAssetPath(path);
  if(mode==='github_raw'){
    const g=APP_CONFIG.github, root=(g.rootPath||'').replace(/^\//,'').replace(/\/$/,'');
    return `https://raw.githubusercontent.com/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/${encodeURIComponent(g.branch||'main')}/${root?root+'/':''}${safe}`;
  }
  if(mode==='cloudflare_proxy') return `/api/github?path=${encodeURIComponent(safe)}`;
  return safe;
}
function assetUrl(path){return assetUrlForMode(path, activeSourceMode || 'local')}
function candidateSourceModes(){
  if(APP_CONFIG.sourceMode && APP_CONFIG.sourceMode !== 'auto') return [APP_CONFIG.sourceMode];
  const modes=['cloudflare_proxy','local'];
  if(githubConfigured()) modes.push('github_raw');
  return modes;
}
async function fetchJSON(path){
  const errors=[];
  for(const mode of candidateSourceModes()){
    try{
      const r=await fetch(assetUrlForMode(path, mode),{cache:'no-store'});
      if(!r.ok) throw new Error(`${r.status}`);
      const data=await r.json();
      activeSourceMode=mode;
      $('sourceBadge').textContent=sourceLabel(mode);
      return data;
    }catch(e){errors.push(`${mode}:${e.message||e}`)}
  }
  throw new Error(`${path}: ${errors.join(' / ')}`);
}
function randomId(prefix='guest'){
  const a=new Uint8Array(8); crypto.getRandomValues(a);
  return prefix+'_'+[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function randomToken(){
  const a=new Uint8Array(18); crypto.getRandomValues(a);
  return [...a].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,24);
}
function getGuest(){return loadLocal(GUEST_KEY,null)}
function setGuest(g){saveLocal(GUEST_KEY,g)}
function clearGuest(){localStorage.removeItem(GUEST_KEY)}
function guestHeaders(){
  const g=getGuest();
  if(!g||!g.id||!g.token) return {};
  return {'X-ME2-Guest-Id':g.id,'X-ME2-Guest-Token':g.token,'X-ME2-Guest-Name':g.name||'ゲスト'};
}
function saveLocal(k,v){localStorage.setItem(k,JSON.stringify(v))}function loadLocal(k,f=null){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch(e){return f}}
const stateKey=(examId,part)=>`me2_state_${examId}_${part}`; const historyKey=(examId,part)=>`me2_history_${examId}_${part}`;
async function apiProgress(method, payload=null){
  if(!APP_CONFIG.cloudProgress) return null;
  try{
    const opt={method,headers:{'content-type':'application/json',...guestHeaders()}};
    if(payload) opt.body=JSON.stringify(payload);
    const r=await fetch('/api/progress',opt);
    if(!r.ok) throw new Error(String(r.status));
    $('progressMode').textContent='端末保存 + Cloudflare KV保存';
    return await r.json();
  }catch(e){$('progressMode').textContent='端末保存のみ（Cloudflare KV未設定または未ログイン）';return null;}
}
async function loadMe(){
  try{const r=await fetch('/api/me',{cache:'no-store',headers:guestHeaders()});if(!r.ok)throw new Error(String(r.status));me=await r.json();}
  catch(e){me={authenticated:false,email:null,name:null,local:true};}
  $('userBadge').textContent=me.email?`ログイン: ${me.email}`:'未ログイン/ローカル';
  return me;
}
function showLoginInfo(){
  hideAll();
  $('loginCard').classList.remove('hidden');
  const g=getGuest();
  const account = g ? `ゲストログイン中：${escapeHtml(g.name||'ゲスト')}<br>ゲストID：<span class="code">${escapeHtml(g.id)}</span><br>復元コード：<span class="code">${escapeHtml(g.token)}</span>` : 'ゲスト未ログイン';
  $('loginInfo').innerHTML=`
    <p><b>状態：</b>${me.accountLabel?escapeHtml(me.accountLabel):escapeHtml(g?`${g.name||'ゲスト'}（ゲスト）`:'未ログイン')}</p>
    <p><b>サイト内ゲスト：</b><br>${account}</p>
    <div class="mobile-note small">
      ゲストIDと復元コードを控えておくと、別端末でも同じ進行状況を復元できます。Cloudflare Accessは使わなくてもOKです。
    </div>
    <div class="row">
      <button onclick="createGuestLogin()">ゲストで開始</button>
      <button class="secondary" onclick="restoreGuestLogin()">既存ゲストでログイン</button>
      <button class="danger" onclick="logoutGuest()">ゲストログアウト</button>
    </div>
    <p><b>Cloudflare Access：</b>${escapeHtml(me.access?.email||me.email||'-')}</p>
  `;
}
function createGuestLogin(){
  const name=prompt('表示名を入力してください（空欄ならゲスト）','ゲスト')||'ゲスト';
  const g={id:randomId('guest'),token:randomToken(),name,createdAt:new Date().toISOString()};
  setGuest(g);
  alert(`ゲストIDと復元コードを控えてください。

ゲストID: ${g.id}
復元コード: ${g.token}`);
  loadMe().then(showLoginInfo);
}
function restoreGuestLogin(){
  const id=prompt('ゲストIDを入力してください'); if(!id)return;
  const token=prompt('復元コードを入力してください'); if(!token)return;
  const name=prompt('表示名を入力してください（空欄ならゲスト）','ゲスト')||'ゲスト';
  setGuest({id:id.trim(),token:token.trim(),name,restoredAt:new Date().toISOString()});
  loadMe().then(showLoginInfo);
}
function logoutGuest(){
  if(confirm('この端末のゲストログイン情報を削除しますか？
※Cloudflare側に保存済みの履歴は、同じゲストID・復元コードで再ログインすれば復元できます。')){
    clearGuest();
    loadMe().then(showLoginInfo);
  }
}
async function loadIndex(){
  $('sourceBadge').textContent='自動確認中';
  try{
    examsIndex=await fetchJSON('Date/Ques/exams_index.json');
    $('loadMode').innerHTML=`<span class="status-ok">読み込み成功（${sourceLabel(activeSourceMode)}）</span>`;
  }catch(e){
    $('loadMode').innerHTML=`<span class="status-warn">読み込み失敗：Date/Ques/exams_index.json が見つかりません。GitHubにDateフォルダが上がっているか確認してください。<br><span class="code">${escapeHtml(e.message||e)}</span></span>`;
    examsIndex={exams:[]};
  }
}
async function getPart(examId,part){const key=`${examId}_${part}`;if(partsCache[key])return partsCache[key];const rec=getExamRecord(examId);const path=rec?.parts?.[part];if(!path)throw new Error('part path missing');partsCache[key]=await fetchJSON(path);return partsCache[key]}
function getExamRecord(id){return examsIndex.exams.find(x=>String(x.id)===String(id))}
function hideAll(){['menuCard','loginCard','partCard','quizCard','finishCard'].forEach(id=>$(id).classList.add('hidden'))}
function showMenu(){hideAll();$('menuCard').classList.remove('hidden');renderMenu();updateHeader()}
function renderMenu(){const grid=$('examGrid');grid.innerHTML='';$('roundCount').textContent=`${examsIndex.exams.length}回分`;if(!examsIndex.exams.length){grid.innerHTML='<div class="mobile-note small">試験回を読み込めません。Date/Ques/exams_index.json が配置されているか確認してください。</div>';return}examsIndex.exams.forEach(ex=>{const div=document.createElement('div');div.className='round-card';div.onclick=()=>selectExam(ex.id);div.innerHTML=`<h3>${escapeHtml(ex.title)}</h3><p class="small">${escapeHtml(ex.subtitle||'')}</p><p class="small">問題数：午前/午後 各60問</p>`;grid.appendChild(div)})}
async function selectExam(examId){currentExamId=examId;hideAll();$('partCard').classList.remove('hidden');const rec=getExamRecord(examId);$('selectedExamTitle').textContent=rec?rec.title:'試験回';await renderPartMenu()}
async function renderPartMenu(){for(const part of ['am','pm']){const box=$(part+'Box'), saved=loadLocal(stateKey(currentExamId,part));const hist=loadLocal(historyKey(currentExamId,part),[]);box.innerHTML=`<h3>${partName(part)}</h3><p class="small">${saved&&!saved.finished?'途中保存あり：'+(saved.index+1)+'問目 / ':''}履歴 ${hist.length}件</p><div class="row"><button onclick="startAttempt('${part}','all')">最初から</button>${saved&&!saved.finished?`<button class="secondary" onclick="resumeAttempt('${part}')">途中から</button>`:''}<button class="ghost" onclick="showHistory('${part}')">履歴</button></div>`}}
async function startAttempt(part,mode='all'){const pack=await getPart(currentExamId||state.examId,part);const total=pack.questions.length;state={examId:currentExamId||state.examId,part,mode,order:[...Array(total).keys()],index:0,correct:0,answers:[],startedAt:Date.now(),finished:false};saveState();startTimer();showQuiz();renderQuestion()}
async function resumeAttempt(part){const s=loadLocal(stateKey(currentExamId,part));if(!s)return;state=s;await getPart(state.examId,part);startTimer();showQuiz();renderQuestion()}
function showQuiz(){hideAll();$('quizCard').classList.remove('hidden')}
function currentPack(){return partsCache[`${state.examId}_${state.part}`]}function getCurrentQuestion(){return currentPack()?.questions?.[state.order[state.index]]}
function renderQuestion(){const q=getCurrentQuestion();if(!q){showFinish();return}$('qMeta').textContent=`${getExamRecord(state.examId).title} ${partName(state.part)} 第${q.number}問 / ${state.order.length}問中${state.index+1}問目　範囲：${q.range||'未設定'}`;$('bar').style.width=`${state.index/state.order.length*100}%`;$('stem').textContent=q.stem;const qImg=$('questionImage');qImg.innerHTML=(q.hasFigure&&q.image)?`<details open><summary>図・表を表示（解答前に確認）</summary><p class="image-hint">この問題は図・表を使います。画像を確認して解答してください。</p><img class="source-img" src="${escapeHtml(assetUrl(q.image))}" alt="図表画像" /></details>`:'';const choices=$('choices');choices.innerHTML='';q.choices.forEach((c,i)=>{const btn=document.createElement('button');btn.className='choice';btn.onclick=()=>answer(i+1);btn.innerHTML=`<span class="num">${i+1}</span><span>${escapeHtml(c)}</span>`;choices.appendChild(btn)});$('result').style.display='none';$('result').className='result';$('result').innerHTML='';$('nextBtn').classList.add('hidden');updateHeader();saveState()}
function answeredCount(){return state.answers.length}
function answer(choice){const q=getCurrentQuestion();if(state.answers[state.index])return;const correct=q.correct.includes(choice);state.answers[state.index]={q:q.number,choice,correct,correctAnswer:q.correct.slice(),time:Date.now()-state.startedAt,range:q.range||''};if(correct)state.correct++;Array.from(document.querySelectorAll('.choice')).forEach((btn,i)=>{btn.disabled=true;const n=i+1;if(q.correct.includes(n))btn.classList.add('correct');if(n===choice&&!correct)btn.classList.add('wrong')});showExplanation(q,choice,correct);$('nextBtn').classList.remove('hidden');$('bar').style.width=`${(state.index+1)/state.order.length*100}%`;saveState();updateHeader();setTimeout(()=>$('result').scrollIntoView({behavior:'smooth',block:'start'}),80)}
function showExplanation(q,choice,correct){const rate=answeredCount()?Math.round(state.correct/answeredCount()*1000)/10:0,res=$('result');res.style.display='block';res.className='result '+(correct?'good':'bad');const rows=q.choices.map((c,i)=>{const n=i+1,isC=q.correct.includes(n),note=(q.choiceNotes&&q.choiceNotes[i])?q.choiceNotes[i]:(isC?'この選択肢が正答です。':'誤りポイント：正答は '+correctLabel(q)+' です。');return`<tr><th>${n}</th><td>${escapeHtml(c)}</td><td>${isC?'✅ 正答':'×'}</td><td>${escapeHtml(note)}</td></tr>`}).join('');const img=(q.hasFigure&&q.image)?`<details><summary>図・表を再表示</summary><img class="source-img" src="${escapeHtml(assetUrl(q.image))}" /></details>`:'';res.innerHTML=`<h3>${correct?'正解！':'不正解'}</h3><p><b>あなたの回答：</b>${choice}　<b>正答：</b>${correctLabel(q)}　<b>現在の正答率：</b>${rate}%</p><p><b>範囲：</b>${escapeHtml(q.range||'未設定')}</p><p><b>要点解説：</b>${escapeHtml(q.tip||'正答表に基づいて判定します。')}</p><table class="explain-table"><thead><tr><th>番号</th><th>選択肢</th><th>判定</th><th>どこが違う？ / 解説ポイント</th></tr></thead><tbody>${rows}</tbody></table>${img}`}
function nextQuestion(){if(state.index>=state.order.length-1){state.finished=true;saveState();saveHistory();showFinish();return}state.index++;saveState();renderQuestion()}
function startTimer(){clearInterval(tickHandle);tickHandle=setInterval(updateHeader,1000);updateHeader()}
function updateHeader(){$('partBadge').textContent=state.part?`${getExamRecord(state.examId)?.title||''} ${partName(state.part)} ${Math.min(state.index+1,state.order.length)}/${state.order.length}`:'未開始';$('scoreBadge').textContent=`${state.correct}/${answeredCount()} 正解`;$('timerBadge').textContent=fmtTime(state.startedAt?Date.now()-state.startedAt:0)}
function saveState(){if(!state.examId||!state.part)return;saveLocal(stateKey(state.examId,state.part),state);apiProgress('POST',{type:'state',examId:state.examId,part:state.part,data:state});$('saveStateText').textContent='保存済み'}
function saveHistory(){const k=historyKey(state.examId,state.part),hist=loadLocal(k,[]);hist.unshift({...state,completedAt:new Date().toISOString()});saveLocal(k,hist);apiProgress('POST',{type:'history',examId:state.examId,part:state.part,data:hist})}
async function resetPart(part){if(confirm(`${getExamRecord(currentExamId).title} ${partName(part)} の途中保存を削除しますか？`)){localStorage.removeItem(stateKey(currentExamId,part));await apiProgress('DELETE',{type:'state',examId:currentExamId,part});renderPartMenu()}}
function showFinish(){clearInterval(tickHandle);hideAll();$('finishCard').classList.remove('hidden');const elapsed=state.answers.length?state.answers[state.answers.length-1].time:(Date.now()-state.startedAt);$('finalPart').textContent=`${getExamRecord(state.examId).title} ${partName(state.part)}`;$('finalScore').textContent=`${state.correct} / ${state.order.length}`;$('finalRate').textContent=`${Math.round(state.correct/state.order.length*1000)/10}%`;$('finalTime').textContent=fmtTime(elapsed);renderWrongList()}
function renderWrongList(){const pack=currentPack(), wrong=state.answers.map((a,i)=>({a,q:pack.questions[state.order[i]]})).filter(x=>!x.a.correct), box=$('wrongList');$('retryWrongBtn').disabled=wrong.length===0;box.innerHTML=`<h3>間違った問題一覧：${wrong.length}問</h3>`+(wrong.length?wrong.map(({a,q})=>`<div class="wrong-item"><b>第${q.number}問 / 範囲：${escapeHtml(q.range||'未設定')}</b><br>あなた：${a.choice} / 正答：${correctLabel(q)}<br><span class="small">${escapeHtml(q.tip||'')}</span></div>`).join(''):'<p class="small">全問正解です。すごい。</p>')}
function retryWrong(){const wrongIndexes=state.answers.map((a,i)=>a.correct?null:state.order[i]).filter(x=>x!==null);if(!wrongIndexes.length)return;state={...state,mode:'wrong',order:wrongIndexes,index:0,correct:0,answers:[],startedAt:Date.now(),finished:false};saveState();startTimer();showQuiz();renderQuestion()}
function showHistory(part){const hist=loadLocal(historyKey(currentExamId,part),[]);hideAll();$('finishCard').classList.remove('hidden');$('wrongList').innerHTML=`<h3>${partName(part)} 履歴</h3>`+(hist.length?hist.map(h=>`<div class="history-row"><b>${new Date(h.completedAt).toLocaleString()}</b><br>${h.correct}/${h.order.length} 正解（${Math.round(h.correct/h.order.length*1000)/10}%）</div>`).join(''):'<p class="small">履歴はまだありません。</p>')}
function downloadText(filename,text,type='application/json'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
function exportCurrentJSON(){downloadText(`progress_${state.examId}_${state.part}.json`,JSON.stringify(state,null,2))}
function exportAllProgress(){const data={exportedAt:new Date().toISOString(),localStorage:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('me2_'))data.localStorage[k]=localStorage.getItem(k)}downloadText('me2_all_progress_backup.json',JSON.stringify(data,null,2))}
function exportCurrentCSV(){const rows=[['回','部門','問題','範囲','あなたの回答','正答','正誤','経過時間']];const pack=currentPack();state.answers.forEach((a,i)=>{const q=pack.questions[state.order[i]];rows.push([getExamRecord(state.examId).title,partName(state.part),q.number,q.range||'',a.choice,a.correctAnswer.join('/'),a.correct?'正解':'不正解',fmtTime(a.time)])});const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');downloadText(`result_${state.examId}_${state.part}.csv`,csv,'text/csv;charset=utf-8')}
function importProgress(input){const f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.localStorage){Object.entries(obj.localStorage).forEach(([k,v])=>localStorage.setItem(k,v));alert('進行データを読み込みました。')}else if(obj.examId&&obj.part){saveLocal(stateKey(obj.examId,obj.part),obj);alert('進行データを読み込みました。')}}catch(e){alert('JSONを読み込めませんでした。')}};reader.readAsText(f)}
async function init(){await loadMe();await loadIndex();await apiProgress('GET');showMenu()}
init();
</script>
